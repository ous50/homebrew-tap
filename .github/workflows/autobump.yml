name: brew bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # README commits use GITHUB_TOKEN, so their pushes do not trigger this workflow.
  workflow_run:
    workflows: ['Update README package list']
    types: [completed]
    branches: [main]
  schedule:
    # Every 30 minutes.
    - cron: 0,30 * * * *

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autobump:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: github-actions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cask: [maaend, maaend-beta]
    concurrency:
      group: cask-update-${{ matrix.cask }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check automation token
        env:
          TAP_BOT_TOKEN: ${{ secrets.TAP_BOT_TOKEN }}
        run: |
          if [[ -z "$TAP_BOT_TOKEN" ]]; then
            echo '::error::Add TAP_BOT_TOKEN to the github-actions environment secrets. See docs/automation.md.'
            exit 1
          fi

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.TAP_BOT_TOKEN }}

      - name: Start from current main
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate cask update
        id: update
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_BOT_TOKEN }}
          CASK: ${{ matrix.cask }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: python3 scripts/cask_automation.py prepare "$CASK" "$TAP_NAME"

      - name: Hand off Git authentication to the PR action
        run: |
          # setup-homebrew sets a global header; create-pull-request adds a local one.
          # Clear the global value to avoid duplicate Authorization headers, but keep
          # the key so setup-homebrew's post-job --unset-all still succeeds.
          git config --global --replace-all "http.${GITHUB_SERVER_URL}/.extraheader" ""

      - name: Create or refresh the cask PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.TAP_BOT_TOKEN }}
          path: ${{ steps.set-up-homebrew.outputs.repository-path }}
          base: main
          branch: automation/${{ matrix.cask }}
          add-paths: Casks/${{ matrix.cask }}.rb
          commit-message: '${{ matrix.cask }} ${{ steps.update.outputs.version }}'
          title: '${{ matrix.cask }} ${{ steps.update.outputs.version }}'
          body: |
            Generated from current main using Homebrew livecheck and bump-cask-pr.
            New releases refresh this PR while it remains open.
            Automatic rebase-and-merge requires successful tests on this exact commit and only version/checksum changes.
