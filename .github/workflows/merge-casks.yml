name: Merge tested cask updates

on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'
  workflow_run:
    workflows: ['brew test-bot']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: merge-cask-updates
  cancel-in-progress: false

jobs:
  merge:
    environment: github-actions
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'automation/maaend' ||
       github.event.workflow_run.head_branch == 'automation/maaend-beta'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out PR code in this privileged workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge only the tested version/checksum update
        env:
          GH_TOKEN: ${{ secrets.TAP_BOT_TOKEN }}
        run: python3 scripts/cask_automation.py merge
