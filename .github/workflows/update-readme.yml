name: Update README package list

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

permissions: {}

jobs:
  update-readme:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      # - name: Check out tested commit
      #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      #   with:
      #     # workflow_run is restricted below to successful pushes to this repo's main.
      #     ref: ${{ github.event.workflow_run.head_sha }}
      #     fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Register tap with Homebrew
      #   run: |
      #     # actions/checkout puts the repo in $PWD, but Homebrew only loads
      #     # casks from inside a tap directory. Replace any existing ous50/tap
      #     # registration and point it at the checkout so brew can resolve
      #     # `ous50/tap/<token>`.
      #     brew untap ous50/tap --force 2>/dev/null || true
      #     brew tap ous50/tap "$PWD"

      - name: Generate README package tables
        run: python3 scripts/update_readme.py

      - name: Commit README update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add README.md
          git commit -m "docs: update package list"
          # Another run may have pushed while we were generating; rebase on top.
          git pull --rebase origin main || true
          git push origin HEAD:main

      # - name: Clean up local tap registration
      #   if: always()
      #   run: brew untap ous50/tap --force 2>/dev/null || true
